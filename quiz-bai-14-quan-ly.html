<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제 14 과 · Điền từ vào chỗ trống</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<style>
:root{--bg:#ffeef5;--bg2:#e8f4ff;--card:#fffdfb;--text:#4a3b4f;--muted:#9a8aa0;--pink:#ff8fb8;--pink2:#ffd3e4;--mint:#7fd8b0;--mint2:#d9f6e8;--red:#ff7a8a;--red2:#ffe0e4;--sky:#8ec5ff;--line:#f3d9e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f2e;--bg2:#1f2733;--card:#372b3c;--text:#fbeaf3;--muted:#c4aecb;--pink:#ff8fb8;--pink2:#5a3446;--mint:#6fd1a6;--mint2:#244237;--red:#ff8d9a;--red2:#4d2a30;--sky:#8ec5ff;--line:#4b3a52}}
:root[data-theme="dark"]{--bg:#2a1f2e;--bg2:#1f2733;--card:#372b3c;--text:#fbeaf3;--muted:#c4aecb;--pink:#ff8fb8;--pink2:#5a3446;--mint:#6fd1a6;--mint2:#244237;--red:#ff8d9a;--red2:#4d2a30;--sky:#8ec5ff;--line:#4b3a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Baloo 2","Nunito","Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));display:flex;justify-content:center;padding:22px 14px;overflow-x:hidden}
.wrap{width:100%;max-width:540px;position:relative}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:24px 22px;box-shadow:0 8px 0 var(--pink2)}
.mascot{font-size:64px;text-align:center;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-size:26px;margin:4px 0;text-align:center;color:var(--pink)}
.sub{color:var(--muted);text-align:center;margin:0 0 6px;line-height:1.5;font-size:16px}
.btn{display:block;width:100%;margin-top:20px;padding:13px;border:0;border-radius:99px;background:var(--pink);color:#fff;font:inherit;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #e0648f;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #e0648f}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px}
.pill{background:var(--pink2);border-radius:99px;padding:3px 12px;font-size:15px}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--mint)}.dots i.bad{background:var(--red)}.dots i.now{background:var(--pink);transform:scale(1.3)}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar>div{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--pink))}
.bar>div.low{background:var(--red)}
.sent{background:var(--bg);border-radius:20px;padding:16px;font-size:21px;line-height:1.75;text-align:center;word-break:keep-all}
.blank{display:inline-block;min-width:78px;border-bottom:4px dotted var(--pink);color:transparent;user-select:none}
.blank.fill{color:var(--mint);border-bottom-color:var(--mint);font-weight:700}
.vi{font-size:15px;color:var(--muted);text-align:center;line-height:1.5;margin:10px 4px 16px}
.vi b{color:var(--pink)}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:19px;cursor:pointer;transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--pink);transform:scale(1.02)}
.opt.ok{background:var(--mint2);border-color:var(--mint);animation:pop .4s}
.opt.bad{background:var(--red2);border-color:var(--red);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.say{text-align:center;min-height:26px;font-weight:700;margin-top:4px}
.score{font-size:56px;font-weight:700;text-align:center;color:var(--pink)}
.wrong{border-top:2px dashed var(--line);padding:9px 0;font-size:16px}
.wrong b{font-size:20px}
.login{display:block;width:100%;margin-top:14px;padding:12px 16px;border-radius:99px;border:3px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:19px;text-align:center}
.login:focus{outline:none;border-color:var(--pink)}
.msg{min-height:24px;text-align:center;font-weight:700;color:var(--red);margin-top:8px}
.hide{display:none}
.star{position:fixed;pointer-events:none;font-size:22px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-120px) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">

<div class="card" id="start">
  <div class="mascot">🐰</div>
  <h1>제 14 과 · 생활과 환경</h1>
  <p class="sub">Điền từ thích hợp vào chỗ trống ✨<br>10 câu · mỗi câu <b id="tShow"></b> giây ⏰</p>
  <p class="sub" style="font-size:14px">Với động từ, bỏ chữ 다 ở cuối khi điền nhé!</p>
  <div id="loginBox" class="hide">
    <input class="login" id="ma" placeholder="Nhập mã học viên" autocomplete="off">
    <p class="sub" style="font-size:13px;margin-top:8px">Mỗi bài làm tối đa <b id="maxShow">3</b> lượt. Thoát giữa chừng vẫn tính 1 lượt nhé!</p>
  </div>
  <div class="msg" id="loginMsg"></div>
  <button class="btn" id="btnStart">BẮT ĐẦU 🌸</button>
</div>

<div class="card hide" id="quiz">
  <div class="top"><span class="pill" id="qNo"></span><span class="pill" id="timeLeft"></span></div>
  <div class="dots" id="dots"></div>
  <div class="bar"><div id="barIn"></div></div>
  <div class="sent" id="sent"></div>
  <div class="vi" id="vi"></div>
  <div id="opts"></div>
  <div class="say" id="say"></div>
</div>

<div class="card hide" id="result">
  <div class="mascot" id="rMascot">🎉</div>
  <h1>Kết quả</h1>
  <div class="score" id="score"></div>
  <p class="sub" id="msg"></p>
  <div id="wrongList"></div>
  <button class="btn" id="btnAgain">Làm lại 🔁</button>
</div>

</div>
<script>
// ====== CẤU HÌNH ======
const TIME_PER_QUESTION = 8;     // số giây mỗi câu
const SHUFFLE_QUESTIONS = false; // true = trộn thứ tự câu
const API_URL = "DÁN_LINK_APPS_SCRIPT_VÀO_ĐÂY"; // link Web app (bắt đầu bằng https://script.google.com/...)
const BAI = "Trung cấp 4 - Bài 14";              // tên bài, dùng để đếm lượt làm
const ONLINE = API_URL.startsWith("https://");   // chưa dán link thì chạy thử, không ghi kết quả

// pre / post: phần câu trước và sau chỗ trống | fill: dạng điền đúng | ans: từ đáp án
// vi: bản dịch (dùng <b> để tô nghĩa của từ cần điền) | opts: 3 đáp án nhiễu | mean: nghĩa của từ đáp án
const QUESTIONS = [
 {pre:"기상청에 따르면 이 ", post:"가 계속되면 한반도에서 겨울이 사라질 가능성이 있다고 합니다.", fill:"상태", ans:"상태", mean:"trạng thái, tình trạng",
  vi:"Theo Cơ quan Khí tượng, nếu <b>tình trạng</b> này tiếp tục kéo dài thì mùa đông có thể biến mất khỏi bán đảo Triều Tiên.", opts:["가스","코너","홍수"]},
 {pre:"", post:"에 따르면 이 상태가 계속되면 한반도에서 겨울이 사라질 가능성이 있다고 합니다.", fill:"기상청", ans:"기상청", mean:"cục khí tượng",
  vi:"Theo <b>Cơ quan Khí tượng</b>, nếu tình trạng này tiếp tục kéo dài thì mùa đông có thể biến mất.", opts:["장터","생태계","행사명"]},
 {pre:"산성비는 안 좋은 가스가 공기 중에 섞여 있다가 빗물에 ", post:"는 것입니다.", fill:"녹아내리", ans:"녹아내리다", mean:"tan chảy, tan ra và chảy xuống",
  vi:"Mưa axit là khí độc hòa lẫn vào không khí, rồi <b>tan ra và chảy xuống</b> cùng nước mưa.", opts:["뽑다","베다","마련하다"]},
 {pre:"산성비가 계속 내리면 ", post:"이 산성화되어 나무가 잘 자라지 못합니다.", fill:"흙", ans:"흙", mean:"đất",
  vi:"Nếu mưa axit cứ tiếp diễn thì <b>đất</b> bị axit hóa và cây khó phát triển.", opts:["면적","목적","사용량"]},
 {pre:"산성비 때문에 ", post:"에 사는 물고기가 죽고 있습니다.", fill:"하천", ans:"하천", mean:"sông, suối",
  vi:"Vì mưa axit nên cá sống ở <b>sông, suối</b> đang chết dần.", opts:["공장","장터","광장"]},
 {pre:"산성비는 물고기나 ", post:" 생물을 죽게 할 정도로 그 피해가 큽니다.", fill:"각종", ans:"각종", mean:"các loại, đủ loại",
  vi:"Tác hại của mưa axit lớn đến mức làm chết cá và <b>các loại</b> sinh vật.", opts:["일회용","재활용","중고"]},
 {pre:"기후변화센터에 따르면 생활 습관을 바꾸면 ", post:"의 발생을 줄일 수 있습니다.", fill:"이산화탄소", ans:"이산화탄소", mean:"khí CO₂",
  vi:"Theo Trung tâm Biến đổi Khí hậu, đổi thói quen sinh hoạt có thể giảm lượng <b>khí CO₂</b> phát sinh.", opts:["산소","티슈","돗자리"]},
 {pre:"물을 아껴 쓰고 ", post:" 사용을 줄입니다.", fill:"온수", ans:"온수", mean:"nước nóng",
  vi:"Dùng nước tiết kiệm và giảm sử dụng <b>nước nóng</b>.", opts:["플러그","티슈","폐휴지"]},
 {pre:"서울시는 아나바다 운동을 ", post:"기 위해 매월 첫째 주 금요일에 나눔 장터를 엽니다.", fill:"장려하", ans:"장려하다", mean:"khuyến khích, thúc đẩy",
  vi:"Thành phố Seoul mở phiên chợ chia sẻ hằng tháng để <b>khuyến khích</b> phong trào Anabada.", opts:["섞이다","뽑다","베다"]},
 {pre:"취급 ", post:": 의류, 신발, 도서, 유아용품 등 재활용이 가능한 중고 물품", fill:"품목", ans:"품목", mean:"hạng mục, mặt hàng",
  vi:"<b>Mặt hàng</b> kinh doanh: quần áo, giày dép, sách, đồ trẻ em và đồ cũ có thể tái sử dụng.", opts:["코너","일기","목적"]}
];
// =======================

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let qs, idx, score, wrongs, timer, deadline, locked, marks;
let maHV = "", attemptId = "", luot = 0, maxLuot = 3, active = false;

function send(p){
  if (!ONLINE) return Promise.resolve(null);
  const u = API_URL + "?" + new URLSearchParams({quiz: 1, bai: BAI, ma: maHV, id: attemptId, ...p});
  return fetch(u, {keepalive: true}).then(r => r.json()).catch(() => null);
}

async function begin(){
  if (ONLINE) {
    maHV = $("ma").value.trim();
    if (!maHV) { $("loginMsg").textContent = "Nhập mã học viên trước nhé 🌸"; return; }
    $("btnStart").disabled = true;
    $("loginMsg").textContent = "Đang kiểm tra...";
    const r = await send({a: "start"});
    $("btnStart").disabled = false;
    if (!r) { $("loginMsg").textContent = "Không kết nối được, thử lại nhé 🥺"; return; }
    if (!r.ok) { $("loginMsg").textContent = r.msg; return; }
    attemptId = r.id; luot = r.luot; maxLuot = r.max; active = true;
    $("loginMsg").textContent = "";
  }
  start();
}

function show(id){ ["start","quiz","result"].forEach(x => $(x).classList.toggle("hide", x !== id)); }

function start(){
  qs = (SHUFFLE_QUESTIONS ? shuffle(QUESTIONS) : QUESTIONS).map(q => ({...q, options: shuffle([q.ans, ...q.opts])}));
  idx = 0; score = 0; wrongs = []; marks = qs.map(() => "");
  show("quiz");
  render();
}

function renderDots(){
  $("dots").innerHTML = qs.map((_, i) => `<i class="${marks[i] || (i === idx ? "now" : "")}"></i>`).join("");
}

function render(){
  const q = qs[idx];
  locked = false;
  $("qNo").textContent = `Câu ${idx + 1}/${qs.length}` + (ONLINE ? ` · Lượt ${luot}/${maxLuot}` : "");
  $("sent").innerHTML = `${q.pre}<span class="blank" id="blank">${q.fill}</span>${q.post}`;
  $("vi").innerHTML = q.vi;
  $("say").textContent = "";
  $("opts").innerHTML = "";
  q.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = `${i + 1}. ${o}`;
    b.dataset.value = o;
    b.onclick = () => answer(b, o);
    $("opts").appendChild(b);
  });
  renderDots();
  deadline = Date.now() + TIME_PER_QUESTION * 1000;
  clearInterval(timer);
  timer = setInterval(tick, 100);
  tick();
}

function tick(){
  const left = Math.max(0, deadline - Date.now());
  $("timeLeft").textContent = "⏰ " + Math.ceil(left / 1000) + "s";
  $("barIn").style.width = (left / (TIME_PER_QUESTION * 1000) * 100) + "%";
  $("barIn").classList.toggle("low", left < TIME_PER_QUESTION * 1000 * 0.35);
  if (left <= 0) answer(null, null);
}

function sparkle(el){
  const r = el.getBoundingClientRect();
  ["⭐","💖","✨","🌸"].forEach((s, i) => {
    const n = document.createElement("span");
    n.className = "star"; n.textContent = s;
    n.style.left = (r.left + 20 + i * 40) + "px"; n.style.top = r.top + "px";
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 1000);
  });
}

function answer(btn, choice){
  if (locked) return;
  locked = true;
  clearInterval(timer);
  const q = qs[idx];
  const correct = choice === q.ans;
  const giay = ((TIME_PER_QUESTION * 1000 - Math.max(0, deadline - Date.now())) / 1000).toFixed(1);
  const log = {a: "ans", cau: idx + 1, tu: q.ans, chon: choice === null ? "(hết giờ)" : choice, dung: correct ? 1 : 0, giay};
  send(log).then(r => r || send(log));
  marks[idx] = correct ? "ok" : "bad";
  if (correct) score++; else wrongs.push({w: q.ans, m: q.mean, got: choice});
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    if (b.dataset.value === q.ans) b.classList.add("ok");
  });
  if (btn && !correct) btn.classList.add("bad");
  $("blank").classList.add("fill");
  $("say").textContent = correct ? "Giỏi quá! 🎉" : choice === null ? "Hết giờ rồi! ⏰" : "Tiếc ghê, thử lại nhé 🥺";
  if (correct) sparkle($("blank"));
  renderDots();
  setTimeout(() => { idx++; idx < qs.length ? render() : finish(); }, 1500);
}

function finish(){
  active = false;
  send({a: "fin", diem: score}).then(r => r || send({a: "fin", diem: score}));
  show("result");
  const n = qs.length, pct = score / n;
  $("rMascot").textContent = pct === 1 ? "🥳" : pct >= 0.7 ? "🐰" : "🐣";
  $("score").textContent = `${score}/${n}`;
  $("msg").textContent = pct === 1 ? "Xuất sắc luôn! 💯" : pct >= 0.7 ? "Làm tốt lắm! 💖" : "Cố gắng ôn thêm nhé! 🌱";
  $("wrongList").innerHTML = wrongs.length
    ? "<p class='sub'>Các từ cần ôn lại:</p>" + wrongs.map(x =>
        `<div class="wrong"><b>${x.w}</b> = ${x.m}<br><span style="color:var(--muted)">Bạn chọn: ${x.got ?? "(hết giờ)"}</span></div>`).join("")
    : "";
}

document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "4" && !$("quiz").classList.contains("hide") && !locked) {
    const b = $("opts").children[+e.key - 1];
    if (b) b.click();
  }
});

$("tShow").textContent = TIME_PER_QUESTION;
$("btnStart").onclick = begin;
if (ONLINE) { $("loginBox").classList.remove("hide"); }
window.addEventListener("beforeunload", e => { if (active) { e.preventDefault(); e.returnValue = ""; } });
$("btnAgain").onclick = () => show("start");
</script>
</body>
</html>
