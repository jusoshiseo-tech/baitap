  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;line-height:1.6}
  .ko{font-family:"Noto Sans KR","Be Vietnam Pro",sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
  header{background:linear-gradient(135deg,var(--pink),var(--blue));padding:28px 16px 24px;text-align:center;
    border-radius:0 0 28px 28px;margin-bottom:18px}
  header h1{margin:0 0 4px;font-size:1.45rem}
  header p{margin:0;color:var(--muted);font-size:.95rem}
  .bar{position:sticky;top:0;z-index:5;background:var(--cream);padding:10px 0 8px}
  .bar-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink-d),var(--blue-d));border-radius:99px;transition:width .25s}
  .intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .intro label{display:block;font-weight:600;margin-bottom:6px}
  .intro input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--cream)}
  .intro input:focus{outline:2px solid var(--blue-d);border-color:var(--blue-d)}
  .intro small{display:block;color:var(--muted);margin-top:6px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px 16px;margin-bottom:14px}
  .card.right{border-color:var(--ok);background:#fbfffd}
  .card.wrong{border-color:var(--bad);background:#fffbfc}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--pink-d)}
  .badge{margin-left:auto;font-size:.82rem;font-weight:600;padding:3px 11px;border-radius:99px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.no{background:var(--bad-bg);color:var(--bad)}
  .stem{font-size:1.12rem;line-height:1.8;margin:0 0 12px;white-space:pre-line}
  .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);margin:0 4px;vertical-align:-2px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:center;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;
    background:var(--cream);cursor:pointer;font-size:1.02rem;transition:background .15s,border-color .15s}
  .opt:hover{border-color:var(--blue-d)}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .l{flex:0 0 26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
  .opt.sel{background:var(--blue);border-color:var(--blue-d)}
  .opt.sel .l{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
  .opt:has(input:focus-visible){outline:2px solid var(--blue-d);outline-offset:2px}
  .locked .opt{cursor:default}
  .locked .opt:hover{border-color:var(--line)}
  .locked .opt.sel:hover{border-color:var(--blue-d)}
  .card.right .opt.sel{background:var(--ok-bg);border-color:var(--ok)}
  .card.right .opt.sel .l{background:var(--ok);border-color:var(--ok)}
  .card.wrong .opt.sel{background:var(--bad-bg);border-color:var(--bad)}
  .card.wrong .opt.sel .l{background:var(--bad);border-color:var(--bad)}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:8px}
  button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:13px 26px;cursor:pointer}
  .btn-main{background:var(--pink-d);color:#fff}
  .btn-main:hover{background:#e87a98}
  .btn-sub{background:var(--blue);color:#2f6f94}
  button:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px}
  .result{background:linear-gradient(135deg,var(--pink),var(--blue));border-radius:24px;padding:22px 18px;text-align:center;margin-bottom:16px}
  .result .score{font-size:2.6rem;font-weight:700;line-height:1.1}
  .result .score small{font-size:1.1rem;font-weight:500}
  .result p{margin:6px 0 0}
  .hidden{display:none}
  .warn{color:var(--bad);text-align:center;font-weight:500;min-height:1.4em;margin:6px 0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<main class="wrap">

    <small>Sau khi nộp bài, bạn sẽ biết câu nào đúng, câu nào sai và tổng điểm.</small>
  </div>

  <div id="quiz"></div>

  <div class="warn" id="warn"></div>
  <div class="actions">
    <button class="btn-main" id="submit">Nộp bài</button>
    <button class="btn-sub hidden" id="retry">Làm lại</button>
  </div>
</main>

const SALT = "ngp4-2026";
const N = 25;            // số câu mỗi lượt làm
const POINT = 10 / N;    // 0,4 điểm / câu

// Bốc ngẫu nhiên N câu từ ngân hàng (Fisher–Yates) và giữ thứ tự ngẫu nhiên đó
function pick(){
  const a = BANK.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, N);
}
let QUESTIONS = pick();
const LET = ['A','B','C','D'];

// Chỉ lưu mã băm của đáp án, không lưu đáp án thật trong file.
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const isRight = (q, letter) => cyrb53(q.id + '|' + q.o[LET.indexOf(letter)] + '|' + SALT) === q.h;

const $ = id => document.getElementById(id);
const quiz = $('quiz');
const picked = {};
let submitted = false;

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function stemHtml(s){return esc(s).replace(/_{2,}/g,'<span class="blank"></span>')}

function render(){
  quiz.innerHTML = QUESTIONS.map((q,i)=>`
    <section class="card" id="q${q.id}">
      <div class="qhead"><span class="qnum">Câu ${i+1}</span><span class="badge hidden"></span></div>
      <p class="stem ko">${stemHtml(q.q)}</p>
      <div class="opts" role="radiogroup" aria-label="Câu ${i+1}">
        ${q.o.map((t,k)=>`
          <label class="opt ko" data-q="${q.id}" data-l="${LET[k]}">
            <input type="radio" name="q${q.id}" value="${LET[k]}">
            <span class="l">${LET[k]}</span><span>${esc(t)}</span>
          </label>`).join('')}
      </div>
    </section>`).join('');
}

quiz.addEventListener('change', e=>{
  if(submitted || e.target.type!=='radio') return;
  const id = +e.target.name.slice(1);
  picked[id] = e.target.value;
  document.querySelectorAll('#q'+id+' .opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===picked[id]));
  updateProgress();
  $('warn').textContent='';
});

function updateProgress(){
  const n = Object.keys(picked).length;
  $('done').textContent = 'Đã làm '+n+'/'+QUESTIONS.length;
  $('fill').style.width = (n/QUESTIONS.length*100)+'%';
}

$('submit').addEventListener('click', ()=>{
  const missing = QUESTIONS.filter(q=>!picked[q.id]);
  if(missing.length){
    const first = missing[0];
    $('warn').textContent = 'Bạn còn '+missing.length+' câu chưa chọn (câu '+(QUESTIONS.indexOf(first)+1)+' là câu đầu tiên).';
    document.getElementById('q'+first.id).scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  grade();
});

function grade(){
  submitted = true;
  let correct = 0;
  QUESTIONS.forEach(q=>{
    const ok = isRight(q, picked[q.id]);
    if(ok) correct++;
    const card = $('q'+q.id);
    card.classList.add(ok?'right':'wrong','locked');
    const b = card.querySelector('.badge');
    b.classList.remove('hidden');
    b.classList.add(ok?'ok':'no');
    b.textContent = ok ? '✓ Đúng' : '✗ Sai';
    card.querySelectorAll('input').forEach(i=>i.disabled=true);
  });
  const score = Math.round(correct*POINT*10)/10;
  const name = $('name').value.trim();
  const msg = score>=8 ? 'Rất tốt!' : score>=5 ? 'Khá ổn, ôn lại các câu sai nhé.' : 'Cố gắng ôn thêm rồi làm lại nhé.';
  const r = $('result');
  r.innerHTML = (name?'<div>'+esc(name)+'</div>':'') +
    '<div class="score">'+String(score).replace('.',',')+'<small> / 10 điểm</small></div>'+
    '<p>Đúng '+correct+'/'+QUESTIONS.length+' câu · '+msg+'</p>';
  r.classList.remove('hidden');
  $('submit').classList.add('hidden');
  $('retry').classList.remove('hidden');
  $('intro').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

$('retry').addEventListener('click', ()=>{
  submitted = false;
  Object.keys(picked).forEach(k=>delete picked[k]);
  $('result').classList.add('hidden');
  $('retry').classList.add('hidden');
  $('submit').classList.remove('hidden');
  $('intro').classList.remove('hidden');
  QUESTIONS = pick();
  render(); updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

render();
</script>
