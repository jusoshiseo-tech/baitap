<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOPIK II · 5 phút</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#f5d6e8,transparent 55%),#fff7fa;color:#392c43;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#a34b76}small{color:#806b80}section{background:#fff;border:1px solid #f0dce7;border-radius:28px;padding:clamp(20px,5vw,40px);margin-top:22px;box-shadow:0 16px 50px #9d557512}h1{font-size:clamp(30px,6vw,48px);line-height:1.1;margin:16px 0}h2{line-height:1.6;font-size:24px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:14px 20px;background:#a94d79;color:white;font-weight:700}button:disabled{opacity:.45;cursor:default}.choice{display:block;width:100%;text-align:left;background:#fff9fc;color:#392c43;border:1px solid #eadbe6;margin:10px 0;font-weight:500}.choice.sel{background:#f5d9e9;border:2px solid #a94d79}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{background:#f5e5f0;padding:8px 14px;border-radius:30px}.track{height:8px;background:#f2e5ed;border-radius:8px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#bd6b99}.muted{background:#eee6f2;color:#60496b}.correct{color:#237451}.wrong{color:#b03960}.review{border-top:1px solid #eee0e8;padding:16px 0}input{width:100%;padding:14px;border:1px solid #e6d5e0;border-radius:12px;margin:12px 0}.tiles{display:flex;gap:10px;margin:24px 0}.tiles span{background:#f5dbe9;border-radius:18px;padding:15px 22px;font-size:30px;font-weight:800;color:#a34b76}.tiles span:nth-child(2){background:#dceee6;color:#477a69}.tiles span:nth-child(3){background:#e8e0f6;color:#7962a0}p{line-height:1.7}</style><main><header><span>한글 · TIẾNG HÀN 5 PHÚT</span><span id="clock" class="pill">05:00</span></header><div id="app"></div></main><script>
const bank=[["Từ vựng", "일자리 có nghĩa là gì?", ["Chính sách", "Việc làm", "Đại hội", "Quân nhân"], 1, "일자리: Việc làm."], ["Từ vựng", "닮다 có nghĩa là gì?", ["Giống", "Tích lũy", "Tăng lên", "Sinh ra"], 0, "닮다: Giống."], ["Từ vựng", "승강장 có nghĩa là gì?", ["Cửa hàng hoa", "Tòa thị chính", "Phòng học", "Khu vực lên xuống phương tiện, sân ga"], 3, "승강장: Khu vực lên xuống phương tiện, sân ga."], ["Từ vựng", "지출하다 có nghĩa là gì?", ["Tham gia", "Nộp", "Chi tiêu", "Tiết kiệm"], 2, "지출하다: Chi tiêu."], ["Từ vựng", "Từ nào có nghĩa là “Tích lũy”?", ["쌓다", "닮다", "걷다", "태어나다"], 0, "쌓다: Tích lũy."], ["Từ vựng", "Từ nào có nghĩa là “Tỷ lệ”?", ["기간", "비율", "대상", "방법"], 1, "비율: Tỷ lệ."], ["Từ vựng", "Từ nào có nghĩa là “Chính sách”?", ["정부", "대회", "제한", "정책"], 3, "정책: Chính sách."], ["Ngữ pháp", "-자마자 có nghĩa là gì?", ["Trong lúc", "Dù cho", "Ngay khi", "Cho đến khi"], 2, "-자마자: Ngay khi."], ["Ngữ pháp", "-더라도 có nghĩa là gì?", ["Dù cho", "Nhằm để", "Chỉ là", "Đã từng"], 0, "-더라도: Dù, cho dù."], ["Ngữ pháp", "-(으)ㄴ 적이 없다 có nghĩa là gì?", ["Có vẻ", "Chưa từng", "Đã từng", "Tương đối"], 1, "-(으)ㄴ 적이 없다: Chưa từng."], ["Ngữ pháp", "-고자 có nghĩa là gì?", ["Trong lúc", "Ngay khi", "Dù cho", "Nhằm để"], 3, "-고자: Nhằm, để."], ["Ngữ pháp", "-(으)ㄹ 리가 없다 có nghĩa là gì?", ["Không có lý nào", "Cũng có thể", "Chỉ là", "Xem như là"], 0, "-(으)ㄹ 리가 없다: Không có lý nào, không lẽ nào."], ["Ngữ pháp", "-기만 하면 có nghĩa là gì?", ["Cho đến khi", "Trong lúc", "Hễ… là…", "Dù cho"], 2, "-기만 하면: Chỉ cần… là…, hễ… là…."], ["Ngữ pháp", "Cấu trúc nào gần nghĩa với -(으)ㄹ 만큼?", ["-다가", "-(으)ㄹ 정도로", "-더라도", "-(으)ㄹ 때까지"], 1, "Cả hai có thể diễn tả mức độ: Đến mức."], ["Ngữ pháp", "Cấu trúc nào gần nghĩa với -기 나름이다?", ["-기 쉽다", "-(으)ㄹ 수도 있다", "-는 동안", "-기에 달려 있다"], 3, "Cả hai diễn tả sự phụ thuộc vào cách thực hiện."]];let qs=[],answers=[],i=0,deadline,timer,student='',done=false;const app=document.getElementById('app'),clock=document.getElementById('clock');function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function home(){clearInterval(timer);clock.textContent='05:00';app.innerHTML=`<section><small>TOPIK II / 읽기 64 · 83</small><div class="tiles"><span>가</span><span>나</span><span>다</span></div><h1>Khởi động<br>tiếng Hàn.</h1><p>15 câu kiểm tra nhanh từ vựng và ngữ pháp trước khi vào bài mới.</p><div class="row"><span class="pill">15 câu</span><span class="pill">5 phút</span><span class="pill">Tự chấm điểm</span></div><input id="name" placeholder="Tên học viên (không bắt buộc)"><button onclick="start()">Bắt đầu kiểm tra →</button></section>`}function start(){student=document.getElementById('name')?.value||'';qs=shuffle(bank).map(([type,q,opts,correct,why])=>{let o=shuffle(opts.map((v,j)=>({v,ok:j===correct})));return {type,q,o,why}});answers=Array(15).fill(-1);i=0;done=false;deadline=Date.now()+300000;timer=setInterval(tick,250);tick();render()}function tick(){let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));clock.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s)finish()}function render(){let q=qs[i];app.innerHTML=`<section><div class="row"><small>CÂU ${i+1} / 15</small><span class="pill">${q.type}</span></div><div class="track"><div class="fill" style="width:${answers.filter(x=>x>=0).length/15*100}%"></div></div><small>Đã trả lời ${answers.filter(x=>x>=0).length}/15</small><h2>${q.q}</h2>${q.o.map((o,j)=>`<button class="choice ${answers[i]===j?'sel':''}" onclick="choose(${j})">${'ABCD'[j]}. ${o.v}</button>`).join('')}<div class="row" style="margin-top:24px"><button class="muted" onclick="go(-1)" ${i===0?'disabled':''}>← Trước</button><button onclick="${i===14?'submitQuiz()':'go(1)'}">${i===14?'Nộp bài':'Tiếp theo →'}</button></div><p><button class="muted" onclick="submitQuiz()">Nộp bài ngay</button></p></section>`}function choose(j){answers[i]=j;render()}function go(n){i+=n;render()}function submitQuiz(){if(answers.includes(-1)&&!confirm('Bạn còn câu chưa trả lời. Nộp bài?'))return;finish()}function finish(){if(done)return;done=true;clearInterval(timer);let score=qs.filter((q,j)=>q.o[answers[j]]?.ok).length,blank=answers.filter(x=>x<0).length;app.innerHTML=`<section><small>KẾT QUẢ / 결과</small><h1>${score}/15</h1><p>Điểm: ${(score/15*10).toFixed(1)}/10 · Đúng ${score} · Sai ${15-score-blank} · Bỏ trống ${blank}</p><p id="student"></p><button onclick="home()">Làm lại ↻</button><h2>Giải thích đáp án</h2>${qs.map((q,j)=>`<div class="review"><strong class="${q.o[answers[j]]?.ok?'correct':'wrong'}">${j+1}. ${q.o[answers[j]]?.ok?'Đúng':'Chưa đúng'}</strong><p>${q.q}<br>Bạn chọn: ${q.o[answers[j]]?.v||'Bỏ trống'}<br><b class="correct">Đáp án: ${q.o.find(o=>o.ok).v}</b><br>${q.why}</p></div>`).join('')}</section>`;document.getElementById('student').textContent=student?'Học viên: '+student:''}home();</script></html>
