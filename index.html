<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lớp tiếng Hàn - Bài tập mỗi ngày</title>
<style>
:root{--bg:#FFF6EE;--card:#FFFFFF;--ink:#3B4A48;--sub:#6D7F7C;--mint:#CBEBDD;--pink:#FAD6DF;--sky:#D6E8F8;--cream:#FFF0C9;--accent:#3E9C86;--ok:#2E8A6F;--bad:#BE5068;--line:#EADFD2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D2624;--card:#27332F;--ink:#EDF5F2;--sub:#AFC2BD;--mint:#2F4B43;--pink:#4C333A;--sky:#2C3D4F;--cream:#4A422A;--accent:#7FD1BC;--ok:#7FD1BC;--bad:#F2A0B2;--line:#3B4B46}}
:root[data-theme="dark"]{--bg:#1D2624;--card:#27332F;--ink:#EDF5F2;--sub:#AFC2BD;--mint:#2F4B43;--pink:#4C333A;--sky:#2C3D4F;--cream:#4A422A;--accent:#7FD1BC;--ok:#7FD1BC;--bad:#F2A0B2;--line:#3B4B46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 12% 8%,var(--pink) 0 90px,transparent 91px),radial-gradient(circle at 92% 18%,var(--sky) 0 70px,transparent 71px),radial-gradient(circle at 80% 96%,var(--mint) 0 110px,transparent 111px);opacity:.7;z-index:-1}
main{max-width:480px;margin:0 auto;padding:24px 16px 56px;text-align:center}
.mascot{width:96px;height:96px;margin:8px auto 0;display:block}
h1{font-size:26px;margin:8px 0 2px}
.sub{color:var(--sub);margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px 18px;text-align:left;box-shadow:0 6px 0 var(--line)}
label,.q{display:block;font-size:21px;font-weight:800;margin:0 0 12px}
input{width:100%;min-height:52px;font-size:20px;padding:8px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;letter-spacing:1px}
.btn{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
:root[data-theme="dark"] .btn{color:#10201B}
.btn:disabled{opacity:.6}
.opt{display:block;width:100%;min-height:54px;text-align:left;font-size:19px;padding:10px 16px;margin-bottom:10px;border-radius:18px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--mint);font-weight:800}
.prog{height:12px;border-radius:12px;background:var(--line);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:12px;transition:width .3s}
.note{font-size:14px;color:var(--sub);margin:0 0 12px}
.err{color:var(--bad);font-weight:700;min-height:22px;margin:8px 0 0}
.score{font-size:56px;font-weight:900;text-align:center;margin:0}
.msg{text-align:center;font-size:18px;margin:0 0 16px}
.rev{border-radius:18px;padding:12px 14px;margin-bottom:10px;background:var(--bg);border:2px solid var(--line)}
.rev b{display:inline-block;padding:1px 10px;border-radius:12px;font-size:14px;margin-right:6px}
.rev .y{background:var(--mint);color:var(--ok)}
.rev .n{background:var(--pink);color:var(--bad)}
.rev p{margin:6px 0 0;font-size:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<svg class="mascot" viewBox="0 0 96 96" aria-hidden="true"><path d="M48 14c-2-8 4-12 10-12-1 6-4 10-10 12z" fill="#7CCBB0"/><path d="M48 14c2-6-2-10-8-10 0 5 3 9 8 10z" fill="#A5DEC8"/><ellipse cx="48" cy="56" rx="36" ry="33" fill="#FFDCE4"/><circle cx="36" cy="54" r="4" fill="#3B4A48"/><circle cx="60" cy="54" r="4" fill="#3B4A48"/><ellipse cx="27" cy="64" rx="6" ry="4" fill="#F7A9BB"/><ellipse cx="69" cy="64" rx="6" ry="4" fill="#F7A9BB"/><path d="M42 64q6 7 12 0" stroke="#3B4A48" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
<h1>한국어 매일 연습</h1>
<p class="sub" id="sub">Bài tập tiếng Hàn mỗi ngày</p>

<section class="card" id="loginBox">
<label for="code">Nhập mã học viên của bạn</label>
<input id="code" autocomplete="off" placeholder="Ví dụ: HV001">
<button class="btn" id="goBtn">Vào học nào</button>
<p class="err" id="err" role="alert"></p>
</section>

<section class="card" id="quizBox" hidden>
<div class="prog"><i id="bar"></i></div>
<p class="note" id="count"></p>
<p class="q" id="qText"></p>
<div id="opts"></div>
<button class="btn" id="nextBtn" disabled>Câu tiếp</button>
</section>

<section id="doneBox" hidden>
<div class="card">
<p class="score" id="score"></p>
<p class="msg" id="msg"></p>
<div id="review"></div>
</div>
</section>
</main>

<script>
/* Dán link Apps Script (Web app) vào đây. Để trống = chạy thử với bài mẫu. */
var API="https://script.google.com/macros/s/AKfycbzDwxyftGmLYek9G-Pstzdkehe6w0VWkpqqzxR9BI1SothloV9LQmb18TW_9ElDx50/exec";

var DEMO=[
{q:"Chữ nào có 받침 (phụ âm cuối)?",o:["가","집","나","소"],a:1,e:"집 = ㅈ + ㅣ + ㅂ, trong đó ㅂ là 받침."},
{q:"밖 đọc là gì?",o:["[바]","[밖]","[박]","[발]"],a:2,e:"Phụ âm cuối ㄲ đọc thành [ㄱ], nên 밖 đọc là [박]."},
{q:"고마워요 nghĩa là gì?",o:["Xin lỗi","Cảm ơn","Xin chào","Tạm biệt"],a:1,e:"고마워요 = Cảm ơn."},
{q:"저는 학생___. Điền vào chỗ trống",o:["예요","이에요","가에요","은요"],a:1,e:"학생 kết thúc bằng phụ âm nên dùng 이에요."},
{q:"먹다 + -ㅂ니다/습니다 = ?",o:["먹ㅂ니다","먹어요","먹습니다","먹니다"],a:2,e:"Thân từ 먹- có 받침 nên thêm -습니다."}
];
var $=function(i){return document.getElementById(i)};
var code="",qs=[],ans=[],idx=0,pick=-1;

async function call(kind,payload){
  if(!API){
    await new Promise(function(r){setTimeout(r,350)});
    if(kind==="start")return{name:"bạn học viên (chạy thử)",questions:DEMO.map(function(d){return{q:d.q,o:d.o}})};
    var sc=0,res=DEMO.map(function(d,i){var ok=payload.answers[i]===d.a;if(ok)sc++;return{correct:ok,answer:d.o[d.a],explain:d.e}});
    return{score:sc,total:DEMO.length,results:res};
  }
  if(kind==="start"){var r=await fetch(API+"?code="+encodeURIComponent(payload.code));return r.json()}
  var r2=await fetch(API,{method:"POST",body:JSON.stringify(payload)});return r2.json();
}
function setErr(t){$("err").textContent=t||""}
$("goBtn").onclick=async function(){
  code=$("code").value.trim();
  if(!code){setErr("Bạn nhớ nhập mã học viên nhé.");return}
  var b=$("goBtn");b.disabled=true;setErr("");
  try{
    var d=await call("start",{code:code});
    if(d.error==="code"){setErr("Mã này chưa đúng. Bạn kiểm tra lại với cô/thầy nhé.")}
    else if(d.error==="empty"){setErr("Hôm nay chưa có bài. Bạn quay lại sau nhé.")}
    else if(d.done){$("loginBox").hidden=true;$("doneBox").hidden=false;$("score").textContent=d.score+"/"+d.total;$("msg").textContent=(d.name?d.name+" ơi, ":"")+"hôm nay bạn đã làm bài rồi. Hẹn bạn ngày mai!"}
    else{qs=d.questions;ans=[];idx=0;$("sub").textContent="Chào "+(d.name||"bạn")+"!";$("loginBox").hidden=true;$("quizBox").hidden=false;show()}
  }catch(e){setErr("Chưa kết nối được. Bạn thử lại nhé.")}
  b.disabled=false;
};
function show(){
  pick=-1;var q=qs[idx];
  $("count").textContent="Câu "+(idx+1)+"/"+qs.length;
  $("bar").style.width=(idx/qs.length*100)+"%";
  $("qText").textContent=q.q;
  var box=$("opts");box.textContent="";
  q.o.forEach(function(t,i){var b=document.createElement("button");b.className="opt";b.textContent=t;b.setAttribute("aria-pressed","false");
    b.onclick=function(){pick=i;Array.prototype.forEach.call(box.children,function(c,j){c.setAttribute("aria-pressed",j===i)});$("nextBtn").disabled=false};
    box.appendChild(b)});
  $("nextBtn").disabled=true;
  $("nextBtn").textContent=idx===qs.length-1?"Nộp bài":"Câu tiếp";
}
$("nextBtn").onclick=async function(){
  ans.push(pick);idx++;
  if(idx<qs.length){show();return}
  var b=$("nextBtn");b.disabled=true;b.textContent="Đang chấm bài...";
  try{
    var d=await call("submit",{code:code,answers:ans});
    if(d.error){$("count").textContent=d.error==="done"?"Hôm nay bạn đã nộp bài rồi.":"Có lỗi, bạn báo cô/thầy nhé.";return}
    $("quizBox").hidden=true;$("doneBox").hidden=false;
    $("score").textContent=d.score+"/"+d.total;
    $("msg").textContent=d.score===d.total?"Tuyệt vời, đúng hết rồi!":d.score>=d.total/2?"Giỏi lắm, cố gắng thêm nhé!":"Không sao, mai mình học tiếp nhé!";
    var rv=$("review");rv.textContent="";
    d.results.forEach(function(r,i){
      var div=document.createElement("div");div.className="rev";
      var tag=document.createElement("b");tag.className=r.correct?"y":"n";tag.textContent=r.correct?"Đúng":"Sai";
      var t=document.createElement("span");t.textContent="Câu "+(i+1)+": "+qs[i].q;
      var p=document.createElement("p");p.textContent="Đáp án: "+r.answer+". "+(r.explain||"");
      div.appendChild(tag);div.appendChild(t);div.appendChild(p);rv.appendChild(div);
    });
  }catch(e){b.disabled=false;b.textContent="Nộp lại";idx=qs.length-1;ans.pop();$("count").textContent="Chưa nộp được, bạn bấm nộp lại nhé."}
};
</script>
</body>
</html>
