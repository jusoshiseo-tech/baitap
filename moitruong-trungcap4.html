<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지구를 지켜요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3F4DF;--card:#FFFFFF;--ink:#1F4D3A;--sub:#4F7563;--line:#B9DDBE;--field:#F2FAF0;
  --accent:#2A7F52;--btn-ink:#FFFFFF;--sun:#FFD84D;--leaf:#4CAF6A;--sky:#BFE6FF;--drop:#6DB8F0;--cloud:#FFFFFF;
  --ok-bg:#C9F0DE;--ok-line:#1F9C6B;--bad-bg:#FFE0D6;--bad-line:#D2573A;--ok-ink:#12714B;--bad-ink:#A8391F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13271F;--card:#1E3A2D;--ink:#EAF8EF;--sub:#A9CDB8;--line:#355C49;--field:#173025;
  --accent:#7FD9A0;--btn-ink:#0F2219;--sun:#FFD84D;--leaf:#7FD9A0;--sky:#2B4B66;--drop:#7CC4F0;--cloud:#2C4D3D;
  --ok-bg:#1E5A47;--ok-line:#6FE0B0;--bad-bg:#5C3326;--bad-line:#FFA68A;--ok-ink:#9DF0CB;--bad-ink:#FFC4B3}}
:root[data-theme="dark"]{
  --bg:#13271F;--card:#1E3A2D;--ink:#EAF8EF;--sub:#A9CDB8;--line:#355C49;--field:#173025;
  --accent:#7FD9A0;--btn-ink:#0F2219;--sun:#FFD84D;--leaf:#7FD9A0;--sky:#2B4B66;--drop:#7CC4F0;--cloud:#2C4D3D;
  --ok-bg:#1E5A47;--ok-line:#6FE0B0;--bad-bg:#5C3326;--bad-line:#FFA68A;--ok-ink:#9DF0CB;--bad-ink:#FFC4B3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;line-height:1.5;overflow-x:hidden}
.kr{font-family:"Jua","Noto Sans KR","Malgun Gothic",sans-serif;font-weight:400}

/* họa tiết nền */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dd{position:absolute}
.dd.c1{left:-14px;top:12%;width:96px;height:58px;color:var(--cloud)}
.dd.c2{right:-20px;top:30%;width:110px;height:66px;color:var(--cloud)}
.dd.c3{left:-24px;top:66%;width:116px;height:70px;color:var(--cloud)}
.dd.l{width:34px;height:34px;color:var(--leaf)}
.dd.d{width:20px;height:24px;color:var(--drop)}
.dd.sn{width:56px;height:56px;color:var(--sun)}
.dd.e{width:48px;height:48px}
.dd.r{font-size:30px;line-height:1}
.drift{animation:drift 6s ease-in-out infinite}
.drift2{animation:drift 8s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
.spinr{animation:spinr 24s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}

main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 16px 56px;text-align:center}

/* dây lá */
.vine{position:relative;display:flex;justify-content:space-between;padding:0 4px;margin:0 -2px 4px}
.vine::before{content:"";position:absolute;left:0;right:0;top:7px;border-top:3px solid var(--leaf);border-radius:3px;opacity:.7}
.lv{display:block;width:34px;height:40px;margin-top:4px;color:var(--leaf);transform-origin:50% 0;animation:sway 4s ease-in-out infinite}
.lv:nth-child(even){color:var(--accent);animation-delay:-2s}
.lv:nth-child(5){color:var(--sun)}
.lv svg{display:block;width:100%;height:100%;transform:rotate(-40deg)}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

.mascot{width:100px;height:100px;margin:6px auto 0;display:block}
h1{font-size:40px;line-height:1.1;margin:6px 0 2px;letter-spacing:.5px}
.sub{font-weight:800;color:var(--sub);margin:0 0 10px}
.stickers{display:flex;justify-content:center;gap:8px;margin:0 0 18px}
.stickers span{width:42px;height:42px;display:grid;place-items:center;font-size:22px;border-radius:50%;background:var(--card);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.stickers span:nth-child(odd){transform:rotate(-7deg)}
.stickers span:nth-child(even){transform:rotate(6deg)}

.card{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:22px 18px;text-align:left;box-shadow:6px 7px 0 var(--leaf),6px 7px 0 3px var(--ink)}
.card::before{content:"";position:absolute;inset:7px;border:2px dashed var(--line);border-radius:21px;pointer-events:none}
.card>*{position:relative}
.q{font-size:20px;font-weight:900;margin:0 0 14px;white-space:pre-line}
.btn{width:100%;min-height:54px;margin-top:14px;border:3px solid var(--ink);border-radius:20px;background:var(--accent);color:var(--btn-ink);font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;font-family:inherit;font-weight:800;font-size:18px;padding:8px 14px 8px 8px;margin-bottom:10px;border-radius:999px;border:2.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;transition:transform .12s}
.opt:hover{transform:translateX(3px)}
.opt .lt{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--card);border:2.5px solid var(--ink);font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;font-size:19px}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok-line);background:var(--ok-bg);animation:pop .35s}
.opt.right::after{content:"✓";font-size:24px;font-weight:900;color:var(--ok-ink)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg);animation:shake .35s}
.opt.wrong::after{content:"✗";font-size:24px;font-weight:900;color:var(--bad-ink)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* tiến độ: 15 chiếc lá lần lượt xanh lên */
.leaves{display:flex;gap:1px;margin-bottom:6px}
.leaves span{flex:1;min-width:0;height:26px;color:var(--line);transition:color .3s,transform .3s}
.leaves span svg{display:block;width:100%;height:100%}
.leaves span.on{color:var(--leaf)}
.leaves span.cur{color:var(--sun);transform:translateY(-3px) scale(1.25)}
.note{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;color:var(--sub);margin:0 0 12px}
.qicon{display:grid;place-items:center;width:34px;height:34px;font-size:18px;border-radius:50%;background:var(--field);border:2px solid var(--line)}
.fb{font-weight:900;margin:4px 0 0;min-height:26px}
.fb.y{color:var(--ok-ink)}.fb.n{color:var(--bad-ink)}

/* kết quả: con dấu tái chế */
.stamp{width:190px;height:190px;margin:4px auto 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;border:4px solid var(--leaf);color:var(--accent);box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 9px var(--leaf);transform:rotate(-8deg);background:var(--card)}
.stamp .st{font-size:26px;line-height:1.1}
.stamp .rc{font-size:22px;line-height:1}
.score{font-family:"Jua","Nunito",sans-serif;font-size:54px;font-weight:400;line-height:1.1;margin:0;color:var(--ink)}
.msg{text-align:center;font-size:18px;font-weight:800;margin:0 0 12px}
.rev{border-radius:18px;padding:12px 14px;margin-bottom:10px;background:var(--field);border:2px solid var(--line);font-size:16px}
.rev p{margin:6px 0 0;color:var(--ok-ink);font-weight:900}
input{width:100%;min-height:54px;font-family:inherit;font-size:20px;font-weight:800;padding:8px 16px;border-radius:18px;border:2.5px solid var(--ink);background:var(--field);color:var(--ink)}
.lab{display:block;font-size:18px;font-weight:900;margin:14px 0 8px}
.err{color:var(--bad-ink);font-weight:800;min-height:22px;margin:8px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:34px}.lv{width:28px;height:34px}.stamp{width:170px;height:170px}.stamp .st{font-size:23px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cloud" viewBox="0 0 80 48"><g fill="currentColor"><circle cx="24" cy="30" r="14"/><circle cx="42" cy="22" r="18"/><circle cx="58" cy="32" r="12"/><rect x="24" y="30" width="34" height="14"/></g></symbol>
    <symbol id="leaf" viewBox="0 0 24 24"><path d="M3 21C3 10 9 4 21 3c0 12-6 18-15 18-1 0-2 0-3 0z" fill="currentColor" style="stroke:var(--ink)" stroke-width="1.4" stroke-linejoin="round"/><path d="M4 20L15 9" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="drop" viewBox="0 0 24 28"><path d="M12 2C12 2 4 11 4 17a8 8 0 0 0 16 0C20 11 12 2 12 2z" fill="currentColor" style="stroke:var(--ink)" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 18a3.5 3.5 0 0 0 3 3" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="sun" viewBox="0 0 48 48"><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M24 3v6M24 39v6M3 24h6M39 24h6M9 9l4 4M35 35l4 4M39 9l-4 4M13 35l-4 4"/></g><circle cx="24" cy="24" r="10" fill="currentColor" style="stroke:var(--ink)" stroke-width="1.6"/><circle cx="20.5" cy="23" r="1.4" fill="#1F4D3A"/><circle cx="27.5" cy="23" r="1.4" fill="#1F4D3A"/><path d="M21 27q3 2.5 6 0" fill="none" stroke="#1F4D3A" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="earth" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#7CC4F0" style="stroke:var(--ink)" stroke-width="2.4"/><path d="M10 18c5-1 7-6 12-6s5 4 2 7-8 2-8 7-6 3-8-8z" fill="#6CCB8B"/><path d="M30 28c4 0 8 2 8 6-2 4-6 6-10 5-2-3-1-9 2-11z" fill="#6CCB8B"/></symbol>
  </defs>
</svg>

<div class="sky" aria-hidden="true">
  <svg class="dd c1"><use href="#cloud"/></svg>
  <svg class="dd c2"><use href="#cloud"/></svg>
  <svg class="dd c3"><use href="#cloud"/></svg>
  <svg class="dd sn spinr" style="right:5%;top:6%"><use href="#sun"/></svg>
  <svg class="dd l drift" style="left:6%;top:34%"><use href="#leaf"/></svg>
  <svg class="dd l drift2" style="right:8%;top:56%"><use href="#leaf"/></svg>
  <svg class="dd l drift" style="left:10%;top:90%"><use href="#leaf"/></svg>
  <svg class="dd d drift2" style="left:4%;top:22%"><use href="#drop"/></svg>
  <svg class="dd d drift" style="right:6%;top:42%"><use href="#drop"/></svg>
  <svg class="dd d drift2" style="right:10%;top:84%"><use href="#drop"/></svg>
  <svg class="dd e drift" style="left:4%;top:78%"><use href="#earth"/></svg>
  <span class="dd r drift2" style="left:8%;top:52%">♻️</span>
  <span class="dd r drift" style="right:4%;top:70%">🌱</span>
</div>

<main>
<div class="vine" aria-hidden="true">
  <span class="lv"><svg viewBox="0 0 24 24"><use href="#leaf"/></svg></span>
  <span class="lv"><svg viewBox="0 0 24 24"><use href="#leaf"/></svg></span>
  <span class="lv"><svg viewBox="0 0 24 24"><use href="#leaf"/></svg></span>
  <span class="lv"><svg viewBox="0 0 24 24"><use href="#leaf"/></svg></span>
  <span class="lv"><svg viewBox="0 0 24 24"><use href="#leaf"/></svg></span>
  <span class="lv"><svg viewBox="0 0 24 24"><use href="#leaf"/></svg></span>
  <span class="lv"><svg viewBox="0 0 24 24"><use href="#leaf"/></svg></span>
</div>

<svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
  <path d="M50 18c0-8 6-12 14-12-1 8-6 12-14 12z" fill="#4CAF6A" stroke="#1F4D3A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M50 18c0-7-5-10-12-10 0 7 4 10 12 10z" fill="#6CCB8B" stroke="#1F4D3A" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="50" cy="58" r="36" fill="#7CC4F0" stroke="#1F4D3A" stroke-width="3"/>
  <path d="M22 46c6-1 9-8 15-8s6 5 3 9-10 3-10 9-7 4-8-10z" fill="#6CCB8B"/>
  <path d="M70 66c5 0 9 3 9 7-3 5-8 7-13 6-2-4-1-11 4-13z" fill="#6CCB8B"/>
  <circle cx="39" cy="58" r="4.2" fill="#1F4D3A"/><circle cx="61" cy="58" r="4.2" fill="#1F4D3A"/>
  <circle cx="40.4" cy="56.6" r="1.3" fill="#fff"/><circle cx="62.4" cy="56.6" r="1.3" fill="#fff"/>
  <ellipse cx="30" cy="68" rx="6" ry="4" fill="#FF9DB0"/><ellipse cx="70" cy="68" rx="6" ry="4" fill="#FF9DB0"/>
  <path d="M44 68q6 7 12 0" stroke="#1F4D3A" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
<h1 class="kr">지구를 지켜요</h1>
<p class="sub">Từ vựng môi trường · Trung cấp 4</p>
<div class="stickers" aria-hidden="true"><span>🌍</span><span>♻️</span><span>🌱</span><span>🔌</span><span>🛍️</span><span>🌧️</span></div>

<section class="card" id="startBox">
<p class="q">Sẵn sàng chưa? Bài có <span id="total"></span> câu ôn từ vựng, làm lần lượt từng câu. Chọn đáp án là biết đúng hay sai ngay.</p>
<label class="lab" for="nameIn">Họ và tên của bạn</label>
<input id="nameIn" autocomplete="name" maxlength="60" placeholder="Ví dụ: Nguyễn Lan">
<p class="err" id="err" role="alert"></p>
<button class="btn" id="startBtn">Gieo hạt nào!</button>
</section>

<section class="card" id="quizBox" hidden>
<div class="leaves" id="leaves" aria-hidden="true"></div>
<p class="note"><span id="count"></span><span class="qicon" id="qIcon" aria-hidden="true"></span></p>
<p class="q" id="qText"></p>
<div id="opts"></div>
<p class="fb" id="fb" role="status"></p>
<button class="btn" id="nextBtn" hidden>Câu tiếp</button>
</section>

<section class="card" id="doneBox" hidden>
<div class="stamp"><span class="rc" aria-hidden="true">♻️</span><span class="st kr">지구 지킴이!</span><p class="score" id="score"></p></div>
<p class="msg" id="msg"></p>
<p class="note" id="sendMsg" style="justify-content:center;text-align:center" role="status"></p>
<button class="btn" id="retryBtn" hidden>Gửi lại điểm</button>
<div id="review"></div>
<button class="btn" id="againBtn">Làm lại</button>
</section>
</main>

<script>
var L=["ㄱ","ㄴ","ㄷ","ㄹ"];
/* a = vị trí đáp án đúng: 0=ㄱ, 1=ㄴ, 2=ㄷ, 3=ㄹ ; t = m (nghĩa của từ), f (điền từ), a (từ trái nghĩa), r (nhớ từ tiếng Hàn từ nghĩa tiếng Việt) */
var Q=[
{t:"m",q:`'지구온난화' nghĩa là gì?`,o:[`Mưa axit`,`Hiện tượng nóng lên toàn cầu`,`Ô nhiễm không khí`,`Khí CO₂`],a:1},
{t:"m",q:`'사라지다' nghĩa là gì?`,o:[`Tan ra và chảy xuống`,`Hóa lẫn, trộn lẫn`,`Làm axit hóa`,`Biến mất`],a:3},
{t:"f",q:`Điền từ thích hợp: 산성비는 공장이나 자동차에서 나온 가스가 공기 중에 ___ 있다가 빗물에 녹아내리는 것입니다.`,o:[`섞여`,`녹아내려`,`사라져`,`뽑아`],a:0},
{t:"f",q:`Điền từ thích hợp: 산성비는 하천이나 흙을 ___ 물고기나 각종 생물을 죽게 할 정도로 피해가 큽니다.`,o:[`장려해`,`마련해`,`산성화시켜`,`강조해`],a:2},
{t:"m",q:`'각종' nghĩa là gì?`,o:[`Các loại, đủ loại`,`Chỉ có một, duy nhất`,`Người khác`,`Mỗi ngày`],a:0},
{t:"r",q:`'Sử dụng tiết kiệm' trong tiếng Hàn là gì?`,o:[`나눠 쓰다`,`아껴 쓰다`,`바꿔 쓰다`,`다시 쓰다`],a:1},
{t:"a",q:`Từ nào trái nghĩa với '냉방' (làm mát, điều hòa)?`,o:[`온수`,`플러그`,`난방`,`티슈`],a:2},
{t:"f",q:`Điền từ thích hợp: 사용하지 않는 전기 제품의 플러그를 ___.`,o:[`뽑는다`,`낮춘다`,`섞는다`,`아낀다`],a:0},
{t:"r",q:`'Không cần thiết' trong tiếng Hàn là gì?`,o:[`아깝다`,`사라지다`,`불필요하다`,`마련하다`],a:2},
{t:"m",q:`'아나바다 운동' là phong trào gì?`,o:[`Phong trào giảm khí CO₂ trong sinh hoạt hằng ngày`,`Phong trào trồng cây xanh ở các thành phố`,`Phong trào đi bộ và đi xe đạp thay cho ô tô`,`Phong trào tiết kiệm, chia sẻ, trao đổi và tái sử dụng`],a:3},
{t:"m",q:`'즉' nghĩa là gì?`,o:[`Cái gọi là`,`Tức là, nói cách khác`,`Ít hơn, giảm bớt`,`Người phụ trách`],a:1},
{t:"f",q:`Điền từ thích hợp: 장터와 함께 재활용 체험 코너도 ___ 합니다.`,o:[`사라진다고`,`낮춘다고`,`뽑는다고`,`마련한다고`],a:3},
{t:"f",q:`Điền từ thích hợp: 나에게는 덜 필요하지만 ___에게는 꼭 필요할 수 있는 물건들`,o:[`목적`,`역할`,`남`,`코너`],a:2},
{t:"f",q:`Điền từ thích hợp: 그냥 버리기엔 ___ 물건들을 재활용합니다.`,o:[`아까운`,`불필요한`,`마련하는`,`사라지는`],a:0},
{t:"r",q:`'Quần áo, trang phục' trong tiếng Hàn là gì?`,o:[`도서`,`의류`,`유아용품`,`보조 도구`],a:1}
];
var ICON={m:"📖",f:"✏️",a:"🔁",r:"🧠"};
var $=function(i){return document.getElementById(i)};
var API="https://script.google.com/macros/s/AKfycbzDwxyftGmLYek9G-Pstzdkehe6w0VWkpqqzxR9BI1SothloV9LQmb18TW_9ElDx50/exec";
var idx=0,score=0,locked=false,wrong=[],student="";
$("total").textContent=Q.length;

(function(){var lv=$("leaves");Q.forEach(function(){var s=document.createElement("span");s.innerHTML='<svg viewBox="0 0 24 24"><use href="#leaf"/></svg>';lv.appendChild(s)})})();
function paint(){var kids=$("leaves").children;for(var i=0;i<kids.length;i++){kids[i].className=i<idx?"on":(i===idx?"cur":"")}}

function start(){idx=0;score=0;wrong=[];$("sendMsg").textContent="";$("retryBtn").hidden=true;$("startBox").hidden=true;$("doneBox").hidden=true;$("quizBox").hidden=false;show()}
function show(){
  locked=false;var q=Q[idx];
  $("count").textContent="Câu "+(idx+1)+"/"+Q.length;
  paint();
  $("qIcon").textContent=ICON[q.t]||"📖";
  $("qText").textContent=q.q;
  $("fb").textContent="";$("fb").className="fb";$("nextBtn").hidden=true;
  var box=$("opts");box.textContent="";
  q.o.forEach(function(t,i){
    var b=document.createElement("button");b.className="opt";
    var l=document.createElement("span");l.className="lt";l.textContent=L[i];
    var x=document.createElement("span");x.className="tx";x.textContent=t;
    b.appendChild(l);b.appendChild(x);
    b.onclick=function(){pick(i)};box.appendChild(b);
  });
}
function pick(i){
  if(locked)return;locked=true;var q=Q[idx],kids=$("opts").children;
  kids[q.a].classList.add("right");
  if(i===q.a){score++;$("fb").textContent="Đúng rồi!";$("fb").className="fb y"}
  else{kids[i].classList.add("wrong");wrong.push(idx);$("fb").textContent="Chưa đúng. Đáp án đúng là "+L[q.a]+".";$("fb").className="fb n"}
  $("nextBtn").textContent=idx===Q.length-1?"Xem điểm":"Câu tiếp";$("nextBtn").hidden=false;
}
function finish(){
  $("quizBox").hidden=true;$("doneBox").hidden=false;
  $("score").textContent=score+"/"+Q.length;send();
  $("msg").textContent=score===Q.length?"Tuyệt vời, đúng hết rồi!":score>=Q.length*0.7?"Giỏi lắm!":"Cố gắng thêm nhé, làm lại để nhớ lâu hơn!";
  var rv=$("review");rv.textContent="";
  if(wrong.length){
    var h=document.createElement("p");h.className="note";h.textContent="Những câu cần xem lại:";rv.appendChild(h);
    wrong.forEach(function(n){
      var d=document.createElement("div");d.className="rev";
      var t=document.createElement("span");t.textContent="Câu "+(n+1)+": "+Q[n].q;t.style.whiteSpace="pre-line";
      var p=document.createElement("p");p.textContent="Đáp án: "+L[Q[n].a]+". "+Q[n].o[Q[n].a];
      d.appendChild(t);d.appendChild(p);rv.appendChild(d);
    });
  }
}
$("startBtn").onclick=function(){
  student=$("nameIn").value.trim();
  if(!student){$("err").textContent="Bạn nhớ nhập họ và tên nhé.";$("nameIn").focus();return}
  $("err").textContent="";start();
};
function send(){
  var m=$("sendMsg");$("retryBtn").hidden=true;m.textContent="Đang gửi điểm...";
  function fail(){m.textContent="Chưa gửi được điểm. Bạn bấm Gửi lại, hoặc chụp màn hình điểm gửi giáo viên nhé.";$("retryBtn").hidden=false}
  fetch(API,{method:"POST",body:JSON.stringify({action:"eomi",bai:"moitruong-trungcap4",name:student,score:score,total:Q.length,wrong:wrong.map(function(n){return n+1})})})
   .then(function(r){return r.json()})
   .then(function(d){if(d&&d.ok){m.textContent="Đã gửi điểm cho giáo viên. Cảm ơn "+student+"!"}else{fail()}})
   .catch(fail);
}
$("retryBtn").onclick=send;
$("againBtn").onclick=start;
$("nextBtn").onclick=function(){idx++;if(idx<Q.length)show();else finish()};
</script>
</body>
</html>
